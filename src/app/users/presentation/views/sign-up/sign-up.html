<div class="login-container">
  <h2>Crear cuenta en CleanWave</h2>

  <form [formGroup]="signUpForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="firstName">Nombre:</label>
      <input id="firstName" type="text" formControlName="firstName" placeholder="Andrea">
    </div>

    <div class="form-group">
      <label for="lastName">Apellido:</label>
      <input id="lastName" type="text" formControlName="lastName" placeholder="García">
    </div>

    <div class="form-group">
      <label for="email">Correo Electrónico:</label>
      <input id="email" type="email" formControlName="email" placeholder="andrea@ejemplo.com">
    </div>

    <div class="form-group">
      <label for="phone">Teléfono (Opcional):</label>
      <input id="phone" type="text" formControlName="phone" placeholder="987654321">
    </div>

    <div class="form-group">
      <label for="password">Contraseña:</label>
      <input id="password" type="password" formControlName="password" placeholder="******">
    </div>

    <button type="submit" [disabled]="signUpForm.invalid">Registrarse</button>
  </form>

  <p class="switch-view">
    ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión aquí</a>
  </p>
</div>
