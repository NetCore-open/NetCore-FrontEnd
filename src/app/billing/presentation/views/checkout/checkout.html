<section class="page">
  <header class="page__header">
    <div class="page__title-block">
      <div class="page__icon">🛒</div>
      <div>
        <h1 class="page__title">Completar Suscripción</h1>
        <p class="page__subtitle">Ingresa tus datos de pago para activar tu plan</p>
      </div>
    </div>
  </header>

  <div class="checkout-container">
    <div class="checkout-card">
      <form [formGroup]="checkoutForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label>Nombre en la tarjeta</label>
          <input type="text" formControlName="cardName" placeholder="EJ. JUAN PEREZ" />
        </div>
        
        <div class="form-group">
          <label>Número de Tarjeta</label>
          <input type="text" formControlName="cardNumber" placeholder="0000 0000 0000 0000" maxlength="16" />
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label>Expiración</label>
            <input type="text" formControlName="expiry" placeholder="MM/YY" maxlength="5" />
          </div>
          <div class="form-group">
            <label>CVC</label>
            <input type="text" formControlName="cvc" placeholder="123" maxlength="4" />
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn-cancel" (click)="onCancel()" [disabled]="store.isLoading()">
            ← Regresar
          </button>
          <button type="submit" class="btn-primary" [disabled]="checkoutForm.invalid || store.isLoading()">
            @if (store.isLoading()) {
              Procesando...
            } @else {
              Confirmar y Pagar
            }
          </button>
        </div>
      </form>
    </div>
  </div>
</section>
